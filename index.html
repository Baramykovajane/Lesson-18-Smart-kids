<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Smart kids – Unit 2</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f4f8fc;--card:#fff;--text:#1d2b3a;--accent:#1e88c8;--soft:#e3f1fb;--ok:#2e9e5b;--bad:#d64545;--line:#d5e3ef}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121a22;--card:#1b2631;--text:#e8eef4;--accent:#5bb5ec;--soft:#23384a;--ok:#4cc27f;--bad:#f07272;--line:#2f4152}}
:root[data-theme="dark"]{--bg:#121a22;--card:#1b2631;--text:#e8eef4;--accent:#5bb5ec;--soft:#23384a;--ok:#4cc27f;--bad:#f07272;--line:#2f4152}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*:before,*:after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Trebuchet MS",Verdana,sans-serif;line-height:1.5}
main{max-width:860px;margin:0 auto;padding:16px}
h1{color:var(--accent);margin:8px 0}
h2{color:var(--accent);margin:28px 0 10px}
.sub{opacity:.75;margin:0 0 8px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px}
.card{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:14px 8px;text-align:center;cursor:pointer;font:inherit;color:inherit}
.card:hover,.card:focus-visible{border-color:var(--accent);transform:translateY(-2px)}
.card .pic{font-size:52px;display:block}
.card b{display:block;margin-top:6px;font-size:17px}
.card small{opacity:.7}
.btn{background:var(--accent);color:#fff;border:0;border-radius:10px;padding:8px 14px;font:inherit;cursor:pointer}
.btn.ghost{background:var(--soft);color:var(--text)}
.dlg{display:flex;flex-direction:column;gap:10px;margin-top:10px}
.line{display:flex;gap:10px;align-items:flex-start;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:10px 12px;cursor:pointer}
.line.on{border-color:var(--accent);background:var(--soft)}
.who{font-weight:bold;color:var(--accent);min-width:64px}
.q{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:12px;margin:10px 0}
.opts{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.opts button{background:var(--soft);color:var(--text);border:2px solid var(--line);border-radius:10px;padding:6px 12px;font:inherit;cursor:pointer}
.opts button.ok{border-color:var(--ok);background:var(--ok);color:#fff}
.opts button.bad{border-color:var(--bad);background:var(--bad);color:#fff}
#score{font-size:20px;font-weight:bold;margin-top:12px}
.note{display:none}
</style>
</head>
<body>
<main>
<h1>🎒 Unit 2: Smart kids</h1>
<p class="sub">Натисни на картку або рядок діалогу, щоб почути вимову. / Click to listen.</p>

<h2>1. Words 🔊</h2>
<div class="grid" id="words"></div>

<h2>2. Listen and read 🎧</h2>
<button class="btn" id="playAll">▶ Прослухати весь діалог</button>
<button class="btn ghost" id="stop">⏹ Стоп</button>
<div class="dlg" id="dlg"></div>

<h2>3. Reading: True or False? ✅❌</h2>
<div id="tf"></div>

<h2>4. Reading: Choose the answer 📖</h2>
<div id="mc"></div>

<div id="score"></div>
<button class="btn ghost" id="reset" style="margin-top:10px">🔄 Спробувати ще раз</button>
</main>

<script>
var words=[["🚌","take the bus","їхати автобусом"],["🚗","drive a car","водити авто"],["🚲","ride a bike","їздити на велосипеді"],["🚶","walk","ходити пішки"],["🚆","take the train","їхати потягом"]];
var dialog=[
["Greg","Hey, Anna! Come with us. My dad drives me to school every day."],
["Anna","Thank you!"],
["Dad","Do you take the bus to school every day, Anna?"],
["Anna","Yes, I do. My mum doesn't drive."],
["Greg","Look, there's Jenny and Billy. They walk to school every day."],
["Greg","Hey! There's Suzie. She rides her bike to school every day."],
["Suzie","Hi, Greg!"]];
var tf=[["Anna takes the bus to school every day.",true],["Greg's dad drives him to school.",true],["Anna's mum drives a car.",false],["Jenny and Billy ride bikes to school.",false],["Suzie rides her bike to school.",true]];
var mc=[["How does Greg go to school?",["By car","By bus","By bike"],0],["Who walks to school?",["Anna","Jenny and Billy","Suzie"],1],["Why does Anna take the bus?",["Her mum doesn't drive","She likes buses","Her dad is ill"],0],["How does Suzie go to school?",["She walks","She takes the train","She rides her bike"],2]];

var voice=null;
function pick(){var v=speechSynthesis.getVoices();voice=v.find(function(x){return /^en[-_]US/i.test(x.lang)})||v.find(function(x){return /^en/i.test(x.lang)})||null}
if("speechSynthesis" in window){pick();speechSynthesis.onvoiceschanged=pick}
function speak(t,done){
 if(!("speechSynthesis" in window)){if(done)done();return}
 var u=new SpeechSynthesisUtterance(t);u.lang="en-US";u.rate=.85;if(voice)u.voice=voice;
 u.onend=function(){if(done)done()};u.onerror=function(){if(done)done()};
 speechSynthesis.speak(u)}
function stopAll(){queue=false;if("speechSynthesis" in window)speechSynthesis.cancel();document.querySelectorAll(".line").forEach(function(l){l.classList.remove("on")})}

var W=document.getElementById("words");
words.forEach(function(w){var b=document.createElement("button");b.className="card";
 b.innerHTML='<span class="pic">'+w[0]+'</span><b>'+w[1]+'</b><small>'+w[2]+'</small>';
 b.onclick=function(){stopAll();speak(w[1])};W.appendChild(b)});

var D=document.getElementById("dlg"),lines=[],queue=false;
dialog.forEach(function(d,i){var e=document.createElement("div");e.className="line";
 e.innerHTML='<span class="who">'+d[0]+':</span><span>'+d[1]+' 🔊</span>';
 e.onclick=function(){stopAll();mark(i);speak(d[1],function(){e.classList.remove("on")})};
 D.appendChild(e);lines.push(e)});
function mark(i){lines.forEach(function(l,j){l.classList.toggle("on",i===j)})}
function playFrom(i){if(!queue||i>=dialog.length){mark(-1);return}
 mark(i);speak(dialog[i][1],function(){playFrom(i+1)})}
document.getElementById("playAll").onclick=function(){stopAll();queue=true;playFrom(0)};
document.getElementById("stop").onclick=stopAll;

var total=tf.length+mc.length,right=0,answered=0;
function build(root,items,isTF){root.innerHTML="";
 items.forEach(function(it,n){var q=document.createElement("div");q.className="q";
  var h=document.createElement("div");h.innerHTML="<b>"+(n+1)+".</b> "+it[0];q.appendChild(h);
  var o=document.createElement("div");o.className="opts";
  var choices=isTF?["True","False"]:it[1];
  var correct=isTF?(it[1]?0:1):it[2];
  var done=false;
  choices.forEach(function(c,k){var b=document.createElement("button");b.textContent=c;
   b.onclick=function(){if(done)return;done=true;answered++;
    if(k===correct){b.className="ok";right++}else{b.className="bad";o.children[correct].className="ok"}
    score()};o.appendChild(b)});
  q.appendChild(o);root.appendChild(q)})}
function score(){var s=document.getElementById("score");
 s.textContent="Результат: "+right+" / "+total+(answered===total?(right===total?" 🌟 Excellent!":" 👍 Good job!"):"")}
function init(){right=0;answered=0;document.getElementById("score").textContent="";
 build(document.getElementById("tf"),tf,true);build(document.getElementById("mc"),mc,false)}
document.getElementById("reset").onclick=init;
init();
</script>
</body>
</html>
